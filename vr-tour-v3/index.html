<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>VR Tour v3 · Cross-Industry Framework</title>
<meta name="description" content="3D Gaussian Splatting VR tour framework — manifest-driven, 6 industries, hotspot navigation, measure tool, dollhouse mode.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0e14;color:#f0f1f2;font-family:"Arial Unicode MS","Heiti TC","Lantinghei SC",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#chrome{position:fixed;inset:0;pointer-events:none;z-index:10}
.bd-color{color:var(--brand,#ff8a3d)}

/* Header */
#header{position:absolute;top:0;left:0;right:0;padding:14px 18px;background:linear-gradient(180deg,rgba(10,14,20,.92),rgba(10,14,20,0));pointer-events:auto;display:flex;align-items:center;gap:10px}
#demo-banner{position:absolute;top:62px;left:14px;right:14px;padding:8px 14px;background:rgba(245,184,77,.12);border:1px solid rgba(245,184,77,.45);border-radius:10px;color:#f5b84d;font-size:11.5px;letter-spacing:.4px;text-align:center;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;line-height:1.5}
#logo{width:34px;height:34px;border-radius:8px;background:var(--brand-grad,linear-gradient(135deg,#ff8a3d,#ffb84d));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#0a0e14}
#brand-name{font-size:15px;font-weight:600;letter-spacing:.4px;color:#fff}
#brand-sub{font-size:10.5px;opacity:.62;color:#cfd2d6;margin-top:1px}

/* Tools row (right column, stays clear of header text) */
#tools{position:absolute;top:14px;right:14px;display:flex;flex-direction:row;gap:5px;pointer-events:auto;align-items:flex-start;flex-wrap:wrap;max-width:calc(100vw - 200px);justify-content:flex-end}
#tools .tool-btn{padding:6px 10px;background:rgba(20,25,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:16px;color:#fff;font-size:11px;cursor:pointer;letter-spacing:.3px;display:flex;align-items:center;gap:6px;min-height:28px}
#tools .tool-btn.active{background:var(--brand-grad,linear-gradient(135deg,#ff8a3d,#ffb84d));color:#0a0e14;border-color:transparent;font-weight:600}
@media (hover:hover) and (pointer:fine){#tools .tool-btn:hover:not(.active){background:rgba(255,255,255,.14)}}

/* Scene picker (just above CTA, away from joystick) */
#scenes{position:absolute;bottom:88px;left:14px;right:14px;display:flex;gap:6px;overflow-x:auto;padding:0 2px 4px 2px;pointer-events:auto;-webkit-overflow-scrolling:touch}
#scenes::-webkit-scrollbar{display:none}
#scenes .scene-pill{flex-shrink:0;padding:7px 14px;background:rgba(20,25,32,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:18px;color:#fff;font-size:11.5px;cursor:pointer;white-space:nowrap}
#scenes .scene-pill.active{background:var(--brand-grad);color:#0a0e14;border-color:transparent;font-weight:600}

/* CTA */
#cta{position:absolute;bottom:14px;left:14px;right:14px;padding:14px 16px;background:rgba(20,25,32,.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--brand-border,rgba(255,138,61,.34));border-radius:16px;pointer-events:auto;animation:fadeIn .6s .4s both}
#cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#cta-text{flex:1;min-width:0}
#cta-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
#cta-desc{font-size:11.5px;color:#a8acb3;line-height:1.45}
#cta-price{color:var(--brand);font-weight:600}
#cta-btn{flex-shrink:0;padding:9px 16px;background:var(--brand-grad);border:none;border-radius:10px;color:#0a0e14;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px}
#cta-btn:active{transform:scale(.96)}

/* Mobile joystick (raised above scene pills + CTA stack) */
#joystick{position:fixed;right:18px;bottom:148px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;touch-action:none;display:none;pointer-events:auto}
#joystick.show{display:block}
#joystick-knob{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--brand-knob,rgba(255,138,61,.55));left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.35)}
#joystick.active #joystick-knob{background:var(--brand-knob-active,rgba(255,184,77,.85))}

/* Loader */
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0e14;z-index:20;transition:opacity .55s}
#loader.gone{opacity:0;pointer-events:none}
#spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--brand,#ff8a3d);border-radius:50%;animation:spin 1s linear infinite}
#loader-text{margin-top:16px;font-size:13px;color:#c2c6cc;letter-spacing:.5px}
#loader-progress{margin-top:10px;font-size:11px;color:#7a7e84;font-variant-numeric:tabular-nums;width:160px;text-align:center}
#loader-bar{margin-top:8px;width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#loader-bar-fill{height:100%;width:0%;background:var(--brand-grad);transition:width .25s ease-out}

/* Hotspots */
.hotspot{position:absolute;width:36px;height:36px;border-radius:50%;background:var(--brand-knob,rgba(255,138,61,.7));border:2px solid #fff;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;transform:translate(-50%,-50%);transition:transform .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.12)}
.hotspot[data-type="text"]::before{content:"i"}
.hotspot[data-type="image"]::before{content:"img"}
.hotspot[data-type="image"]{font-size:9px}
.hotspot[data-type="video"]::before{content:"\25B6"}
.hotspot[data-type="link"]::before{content:"\2197"}
.hotspot[data-type="nav"]::before{content:"\2192"}
.hotspot.hidden{opacity:0;pointer-events:none}
@media (hover:hover) and (pointer:fine){.hotspot:hover{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 5px rgba(255,255,255,.18)}}
.hotspot:active{transform:translate(-50%,-50%) scale(.92)}

/* Hotspot panel */
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:88vw;max-width:420px;background:rgba(15,20,28,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;color:#fff}
#panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#panel h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--brand)}
#panel p{font-size:13px;line-height:1.55;color:#c8ccd2}
#panel img,#panel video{width:100%;max-height:50vh;border-radius:10px;margin-top:10px;object-fit:contain;background:#000}
#panel a{color:var(--brand);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
#panel-close{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#panel-close:active{background:rgba(255,255,255,.2)}

/* Measure UI */
#measure-ui{position:fixed;left:50%;top:74px;transform:translateX(-50%);padding:8px 14px;background:rgba(20,25,32,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:18px;color:#fff;font-size:12px;z-index:55;display:none;pointer-events:none}
#measure-ui.show{display:block}
#measure-ui b{color:var(--brand);font-variant-numeric:tabular-nums;margin-left:4px}
.measure-marker{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--brand);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 4px rgba(255,138,61,.25)}
.measure-line{position:absolute;height:2px;background:var(--brand);transform-origin:left center;pointer-events:none;box-shadow:0 0 8px rgba(255,138,61,.5)}
.measure-label{position:absolute;padding:3px 8px;background:rgba(20,25,32,.92);border:1px solid var(--brand);border-radius:8px;color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;transform:translate(-50%,-130%);pointer-events:none}

/* Dollhouse cutaway slider (left side, clear of right tool column) */
#cutaway{position:fixed;left:14px;top:62px;width:38px;height:160px;background:rgba(20,25,32,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:18px;display:none;flex-direction:column;align-items:center;padding:10px 0;z-index:55;pointer-events:auto}
#cutaway.show{display:flex}
#cutaway label{font-size:9.5px;color:#a8acb3;margin-bottom:6px;writing-mode:vertical-rl;text-orientation:mixed}
#cutaway input{flex:1;-webkit-appearance:slider-vertical;appearance:slider-vertical;width:6px}

/* VR button */
#vr-btn{padding:7px 14px;background:rgba(20,25,32,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--brand-border,rgba(255,138,61,.45));border-radius:18px;color:var(--brand);font-size:11.5px;cursor:pointer;display:none;font-weight:600;min-height:30px}
#vr-btn.show{display:block}

/* Permission dialog (gyro iOS) */
#perm-dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px 22px;background:rgba(15,20,28,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:16px;z-index:90;color:#fff;text-align:center;display:none;max-width:88vw}
#perm-dialog.show{display:block}
#perm-dialog h3{font-size:15px;margin-bottom:8px}
#perm-dialog p{font-size:12.5px;color:#a8acb3;margin-bottom:14px;line-height:1.5}
#perm-dialog button{margin:0 4px;padding:8px 18px;border-radius:10px;border:none;font-size:12.5px;font-weight:600;cursor:pointer}
#perm-yes{background:var(--brand-grad);color:#0a0e14}
#perm-no{background:rgba(255,255,255,.12);color:#fff}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Tablet/desktop tweaks */
@media (min-width:768px){
  #cta{left:50%;right:auto;transform:translateX(-50%);max-width:520px}
  #scenes{left:50%;right:auto;transform:translateX(-50%);max-width:560px;justify-content:center}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="joystick"><div id="joystick-knob"></div></div>

<div id="chrome">
  <div id="header">
    <div id="logo" data-bind="brand_short"></div>
    <div>
      <div id="brand-name" data-bind="brand_name">VR Tour</div>
      <div id="brand-sub" data-bind="brand_sub">3D Gaussian Splatting</div>
    </div>
  </div>

  <div id="demo-banner">框架演示 · 当前用公开 splat · 扫你的真实空间后才显示真房</div>

  <div id="tools">
    <button class="tool-btn" id="btn-walk" data-mode="walk">walk</button>
    <button class="tool-btn" id="btn-measure" data-mode="measure">measure</button>
    <button class="tool-btn" id="btn-dollhouse" data-mode="dollhouse">dollhouse</button>
    <button id="vr-btn">VR</button>
  </div>

  <div id="measure-ui">distance:<b id="measure-val">0.00 m</b></div>

  <div id="cutaway">
    <label>cut</label>
    <input type="range" id="cutaway-slider" min="0" max="100" value="100" orient="vertical">
  </div>

  <div id="scenes"></div>

  <div id="cta">
    <div id="cta-row">
      <div id="cta-text">
        <div id="cta-title" data-bind="cta_title">Welcome</div>
        <div id="cta-desc"><span id="cta-price" data-bind="cta_price"></span> <span data-bind="cta_desc"></span></div>
      </div>
      <button id="cta-btn" data-bind="cta_button">Learn more</button>
    </div>
  </div>
</div>

<div id="panel">
  <button id="panel-close">&#x00D7;</button>
  <div id="panel-content"></div>
</div>

<div id="perm-dialog">
  <h3>enable motion sensors?</h3>
  <p>Tilt your phone to look around. iOS requires permission.</p>
  <button id="perm-yes">enable</button>
  <button id="perm-no">skip</button>
</div>

<div id="loader">
  <div id="spinner"></div>
  <div id="loader-text">loading splat scene...</div>
  <div id="loader-bar"><div id="loader-bar-fill"></div></div>
  <div id="loader-progress">0%</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
  "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark/dist/spark.module.js"
}}
</script>

<script type="module">
import { loadManifest, applyBranding } from "./js/manifest-loader.js";
import { SceneController } from "./js/scene-controller.js";
import { MeasureTool } from "./js/tools-measure.js";
import { DollhouseMode } from "./js/tools-dollhouse.js";
import { AnnotationLayer } from "./js/tools-annotation.js";
import { MobileUX } from "./js/mobile-ux.js";

const params = new URLSearchParams(location.search);
const industry = params.get("industry") || "residential";
const customManifestUrl = params.get("manifest_url");

let manifest;
try {
  manifest = await loadManifest({ industry, customManifestUrl });
} catch (e) {
  document.getElementById("loader-text").textContent = "manifest load failed";
  document.getElementById("loader-progress").textContent = String(e).slice(0, 80);
  console.error("[v3] manifest load fail", e);
  throw e;
}
applyBranding(manifest);
window.__manifest = manifest;

const startSceneId = params.get("scene") || manifest.scenes[0].id;
const ctrl = new SceneController({ canvas: document.getElementById("canvas"), manifest });
window.__ctrl = ctrl;
await ctrl.init();

const measure = new MeasureTool(ctrl);
const dollhouse = new DollhouseMode(ctrl);
const annot = new AnnotationLayer(ctrl, manifest);
const mobile = new MobileUX(ctrl);

ctrl.setMode("walk");
window.__measure = measure;
window.__dollhouse = dollhouse;
window.__annot = annot;
window.__mobile = mobile;

// Tool buttons -------------------------------------------------------------
document.querySelectorAll("#tools .tool-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const m = btn.dataset.mode;
    ctrl.setMode(m);
    document.querySelectorAll("#tools .tool-btn").forEach(b => b.classList.toggle("active", b === btn));
    measure.toggle(m === "measure");
    dollhouse.toggle(m === "dollhouse");
    annot.setVisible(m !== "dollhouse");
  });
});
// Default = walk
document.getElementById("btn-walk").classList.add("active");

// Scene pills --------------------------------------------------------------
const scenesEl = document.getElementById("scenes");
manifest.scenes.forEach(s => {
  const pill = document.createElement("button");
  pill.className = "scene-pill";
  pill.textContent = s.label;
  pill.dataset.id = s.id;
  pill.addEventListener("click", () => ctrl.loadScene(s.id));
  scenesEl.appendChild(pill);
});
ctrl.onSceneChange = (sceneId) => {
  document.querySelectorAll("#scenes .scene-pill").forEach(p => p.classList.toggle("active", p.dataset.id === sceneId));
  annot.refreshHotspots();
};

// CTA --------------------------------------------------------------------
document.getElementById("cta-btn").addEventListener("click", () => {
  const cta = manifest.cta || {};
  if (cta.url) {
    window.open(cta.url, "_blank");
  } else {
    alert(cta.alert || "Contact: see manifest.cta.alert");
  }
});

// Panel close ------------------------------------------------------------
document.getElementById("panel-close").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("show");
});

// Hotspot click delegated to annot ---------------------------------------
document.addEventListener("click", e => {
  const hs = e.target.closest(".hotspot");
  if (!hs) return;
  annot.handleClick(hs.dataset.id);
});

// Load initial scene -----------------------------------------------------
await ctrl.loadScene(startSceneId);
mobile.attach();

// Hard fallback hide loader (25s) ---------------------------------------
setTimeout(() => document.getElementById("loader").classList.add("gone"), 25000);
</script>
</body>
</html>
