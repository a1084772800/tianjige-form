<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Language" content="zh-CN">
<title>天机阁 · 动态页面</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #0a0a0a;
  color: #e8e0d0;
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
}
.loading h1 {
  font-size: 1.4rem;
  background: linear-gradient(to right, #f6d365, #fda085);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.loading .spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(246,211,101,0.2);
  border-top-color: #f6d365;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading .status {
  color: #a09080;
  font-size: 0.85rem;
  margin-top: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error {
  text-align: center;
  padding: 60px 20px;
  color: #a09080;
}
.error h2 { color: #f6d365; margin-bottom: 12px; }
.error .retry-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 8px;
  border: 1px solid #f6d365;
  color: #f6d365;
  background: transparent;
  cursor: pointer;
  font-size: 0.95rem;
}
.error .retry-btn:active { opacity: 0.7; }
#render-frame {
  width: 100%;
  height: 100vh;
  border: none;
  display: none;
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <h1>天机阁</h1>
  <div class="spinner"></div>
  <div class="status" id="load-status">加载中...</div>
</div>

<div class="error" id="error" style="display:none">
  <h2 id="error-icon">⚠️</h2>
  <p id="error-msg"></p>
  <button class="retry-btn" onclick="loadPage()">重新加载</button>
</div>

<iframe id="render-frame" sandbox="allow-scripts allow-popups allow-forms"></iframe>

<script>
const API = 'https://v609a76lof.sealoshzh.site';
const MAX_RETRIES = 3;
const RETRY_DELAYS = [1000, 2000, 4000];
const FETCH_TIMEOUT = 15000;

const params = new URLSearchParams(location.search);
const id = params.get('id');

// ── Scroll position 持久化（PARENT 端，因 iframe height=auto 实际滚的是外层）───
// iframe 用 sandbox（无 allow-same-origin），parent.body 把 iframe.style.height 设成
// 全内容高度，所以 OUTER document 才是真正可滚动的；iframe 内部的 window.scroll
// 事件根本不会触发——bridge 里的 saveScroll 是僵尸代码（保留兼容旧 srcdoc）。
// 这里在 PARENT 加 listener，按 id 分 key，保证 PWA/X5/iOS Safari 切回不丢位置。
//
// 0729 重写（owner 报「归档页不回到阅读位置了」，实测复现存档被冲成 1156）：
//  ① 存档只认**真实手势**（touch/wheel/键盘）。老实现一恢复完就开放保存闸，
//     图片懒加载失败 / 折叠复位 / WebView 回收 tile 让页面变矮时，浏览器当场截断
//     scrollY 并照常派 scroll 事件 → 把好位置冲成一个小值写回 localStorage。
//     用户根本没碰屏幕，存档却被污染，而且**下次打开只会恢复到那个小值** = 永久失效。
//  ② 恢复由**高度变化**驱动（ResizeObserver + resize 桥），不再是固定 40×200ms 轮询。
//     归档页高度随天数单调增长，固定预算迟早不够，用尽后内容再变高也不会补救。
//  ③ 关掉浏览器原生 scrollRestoration：内容是异步 fetch + srcdoc 注入的，
//     原生恢复只会滚到一个内容还没到位的错位置，还会跟我们抢方向盘。
//  ④ ?debug=scroll 自检面板：手机上没法 attach 调试器，出问题必须能当场看出
//     是「没存住」还是「存了没恢复」。
var SCROLL_KEY = 'scroll_render_' + (id || 'unknown');
var DEBUG_SCROLL = params.get('debug') === 'scroll';
var pTarget = 0;            // >0 = 守着存档：既欠一次恢复，也不许被 layout shift 冲掉
var pUserTouched = false;   // 真实手势才算「用户接管」，此后才允许写存档
var pSaveTimer = null, pTries = 0, pLastNote = '';
// 内容几乎铺满整个 iframe，用户的 touch/wheel 落在**跨域 iframe 内**、冒泡不到 parent，
// 所以手势信号由 bridge 转发（下方 {type:'gesture'}）。这里再加一道不依赖 iframe 配合的
// 兜底：页面刚缩水的一瞬间，浏览器截断 scrollY 派出的 scroll 事件一律不落盘。
var pLastDocH = 0, pShrinkUntil = 0, pShrinkFrom = 0, pShrinkY = 0;

try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch(_) {}

function pNote(s) { pLastNote = s; pDbgRender(); }

function pFlushScroll() {
  if (pTarget > 0 && !pUserTouched) return;   // 守护期：任何非手势滚动都不落盘
  // 收缩抑制只挡"被截断"这一种：截断只会把 scrollY 往**小**里改，绝不会变大。
  // 所以仅当「抑制窗内 + 用户没碰过屏幕 + 位置比缩水前更靠上」三者同时成立才吞掉这次保存；
  // 用户在重排期主动往下滑（y 变大）是明确意图，必须存（0729 回归：抑制窗吃掉用户首次滚动）。
  var y = window.scrollY || window.pageYOffset || 0;
  if (Date.now() < pShrinkUntil && !pUserTouched && y < pShrinkY) { pNote('shrink guard'); return; }
  if (pSaveTimer) { clearTimeout(pSaveTimer); pSaveTimer = null; }
  try {
    if (y > 0) localStorage.setItem(SCROLL_KEY, String(y));
    else localStorage.removeItem(SCROLL_KEY);
    pNote('saved ' + y);
  } catch(err) { pNote('SAVE FAILED: ' + err); }   // 配额爆了/隐私模式要看得见，别静默吞
}
function pSaveScroll() {
  if (pTarget > 0 && !pUserTouched) { pDbgRender(); return; }
  if (pSaveTimer) clearTimeout(pSaveTimer);
  pSaveTimer = setTimeout(pFlushScroll, 400);
}
function pUserGesture() {
  if (pUserTouched) return;
  pUserTouched = true; pTarget = 0; pNote('user took over');
  // 手势是从 iframe 经 postMessage **异步**到的，本次滚动派出的 scroll 事件
  // 早在守护期里被挡掉了；滚动停下后不会再有 scroll 事件，得自己补一次落盘，
  // 否则用户滚到哪都存不进去（保存闸看着像焊死）。
  pSaveScroll();
}
['touchstart', 'pointerdown', 'mousedown', 'wheel', 'keydown'].forEach(function(ev) {
  window.addEventListener(ev, pUserGesture, { passive: true, capture: true });
});
window.addEventListener('scroll', pSaveScroll, { passive: true });
window.addEventListener('pagehide', pFlushScroll);   // freeze 前最后一次机会
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') pFlushScroll();
});

function pTryRestore(why) {
  if (!pTarget || pUserTouched) return;
  var sh = document.documentElement.scrollHeight;
  var need = pTarget + Math.min(window.innerHeight || 600, 200);
  if (sh < need) { pNote('wait height ' + sh + '/' + need + ' (' + why + ')'); return; }
  pTries++;
  window.scrollTo(0, pTarget);
  var actual = window.scrollY || window.pageYOffset || 0;
  pNote((Math.abs(actual - pTarget) <= 2 ? 'restored ' : 'partial ') + actual + '/' + pTarget
        + ' t' + pTries + ' (' + why + ')');
}
function pBeginRestore(why) {
  if (pUserTouched) return;
  try { pTarget = parseInt(localStorage.getItem(SCROLL_KEY) || '0', 10) || 0; } catch(_) { pTarget = 0; }
  if (pTarget <= 0) { pNote('no saved position'); return; }
  pTryRestore(why);
}
// 高度变化是唯一可靠的「内容到位」信号：异步 fetch → 渲染 → 图片回填，每一步都可能改高度
if (window.ResizeObserver) {
  try {
    new ResizeObserver(function() {
      var sh = document.documentElement.scrollHeight;
      // 内容重排中（骤降 = 列表被清空/筛掉，浏览器当场截断 scrollY 并照常派 scroll 事件）：
      // 这段时间的 scrollY 不是用户读到的位置，一律不许落盘。高度回来了立刻解除，
      // 这样「新那天内容真的更短」时用户的正常滚动照样存得进去。
      if (pLastDocH && sh < pLastDocH * 0.6) {
        pShrinkUntil = Date.now() + 3000; pShrinkFrom = pLastDocH;
        pShrinkY = window.scrollY || window.pageYOffset || 0;   // 缩水前停在哪
      }
      else if (pShrinkFrom && sh >= pShrinkFrom * 0.8) { pShrinkUntil = 0; pShrinkFrom = 0; }
      pLastDocH = sh;
      pTryRestore('resize-observer');
    }).observe(document.documentElement);
  } catch(_) {}
}
window.addEventListener('load', function() { pBeginRestore('load'); });
document.addEventListener('DOMContentLoaded', function() { pBeginRestore('domready'); });
// 兜底：某些 WebView 的 RO 对 documentElement 不回调；30 秒内低频补几拍，之后放行保存闸
//（手势事件万一全都缺失，不能让位置永远存不进去）
var pTick = setInterval(function() { pTryRestore('tick'); }, 700);
setTimeout(function() {
  clearInterval(pTick);
  if (!pUserTouched) { pTarget = 0; pNote('guard released (30s)'); }
}, 30000);
// bfcache 回来（iOS Safari / 安卓 Chrome 后台不 reload 走这里）：DOM 还在但 scrollY 可能被 snap 到 0
window.addEventListener('pageshow', function(e) {
  if (e.persisted) { pUserTouched = false; pTries = 0; pBeginRestore('bfcache'); }
});

// ?debug=scroll：手机上一眼看出是没存住还是没恢复
function pDbgRender() {
  if (!DEBUG_SCROLL) return;
  var box = document.getElementById('p-dbg');
  if (!box) {
    box = document.createElement('div');
    box.id = 'p-dbg';
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
      + 'background:rgba(0,0,0,.86);color:#7CFC9A;font:11px/1.5 ui-monospace,Menlo,monospace;'
      + 'padding:8px 10px;border:1px solid #2b7;border-radius:8px;white-space:pre-wrap;'
      + 'pointer-events:none';
    document.body.appendChild(box);
  }
  var stored = '(读不到)';
  try { stored = localStorage.getItem(SCROLL_KEY); } catch(err) { stored = 'ERR ' + err; }
  box.textContent = 'key ' + SCROLL_KEY
    + '\n存档 ' + stored + '   当前 y ' + Math.round(window.scrollY || 0)
    + '   docH ' + document.documentElement.scrollHeight
    + '\n守护 ' + (pTarget > 0 ? 'ON→' + pTarget : 'off')
    + '   用户已接管 ' + pUserTouched + '   ' + pLastNote;
}
if (DEBUG_SCROLL) { setInterval(pDbgRender, 500); }

// 桥接：iframe 因 sandbox 无 same-origin / top-navigation，走 postMessage
window.addEventListener('message', function(e) {
  var frame = document.getElementById('render-frame');
  if (!frame || e.source !== frame.contentWindow) return;
  var d = e.data || {};
  if (d.type === 'resize' && typeof d.height === 'number' && d.height > 100 && d.height < 4000000) {
    frame.style.height = d.height + 'px';
    pTryRestore('bridge-resize');       // 高度刚到位，是恢复的最佳时机
  } else if (d.type === 'gesture') {
    // 用户的 touch/wheel 落在跨域 iframe 里、冒泡不到 parent，只能靠 bridge 转发。
    // 收到 = 用户真的接管了滚动，此后才允许写存档（见上方守护期说明）。
    pUserGesture();
  } else if (d.type === 'navigate' && typeof d.url === 'string') {
    // 简单 URL 校验：必须是绝对 http(s) 链接，禁 javascript: / data: 等
    if (/^https?:\/\//i.test(d.url)) {
      window.top.location.href = d.url;
    }
  } else if (d.type === 'title' && typeof d.text === 'string' && d.text.trim()) {
    // 页面自定义标签页标题（可选桥）：内容页发 {type:'title', text} 覆盖默认
    // 的「天机阁 · <title>」前缀（2026-07-13 乔氏驾驶舱去品牌残留；向后兼容，
    // 不发消息的页面行为不变）
    document.title = d.text.slice(0, 80);
  } else if (d.type === 'getHash') {
    // 沙箱 iframe 拿不到 parent.location.hash（cross-origin），走 postMessage 桥接
    try { e.source.postMessage({ type: 'hash', hash: location.hash || '' }, '*'); } catch(err) {}
  } else if (d.type === 'setHash' && typeof d.hash === 'string') {
    // iframe 内 token-status 编辑后回写 parent URL → owner 刷新仍持久
    try {
      var newHash = d.hash;
      if (newHash && newHash.charAt(0) !== '#') newHash = '#' + newHash;
      // 用 replaceState 不进 history（owner 反复点不堆栈）
      history.replaceState(null, '', location.pathname + location.search + newHash);
    } catch(err) {}
  } else if (d.type === 'scrollTo' && typeof d.y === 'number' && d.y >= 0) {
    // 内容页请 parent 代滚（深链跳转 / 页内目录 / 回到顶部）。
    // 为什么内容页自己滚不了：iframe 用 sandbox 且 height 被设成**全内容高度**，
    // iframe 内部根本没有可滚动的视口，window.scrollTo 在里面是空操作——
    // 真正在滚的一直是 OUTER document。iframe top=0，所以内容页元素的 offsetTop
    // 直接就是 parent 该滚到的 y，不用换算。
    // 复用 pTarget 那套守护：高度还没撑够时 pTryRestore 会等 bridge-resize 再试，
    // 不必在内容页里瞎轮询。pUserTouched 强制归零 = 深链优先于上次的阅读位置存档
    // （用户明确点了某一节，就不该被"上回读到哪"拽回去）。
    var ty = Math.max(0, Math.round(d.y));
    if (ty === 0) {
      // 回到顶部：pTryRestore 的 `!pTarget` 会把 0 当"没有目标"挡掉，直接滚。
      pTarget = 0; pUserTouched = true; window.scrollTo(0, 0); pNote('deep-link top');
    } else {
      pTarget = ty; pUserTouched = false; pTries = 0; pTryRestore('deep-link');
    }
  } else if (d.type === 'getStorage' && typeof d.key === 'string') {
    // sandboxed iframe 没 same-origin，自身 localStorage 抛 SecurityError；走 parent 代存
    try {
      var v = localStorage.getItem(d.key);
      e.source.postMessage({ type: 'storage', key: d.key, value: v || '' }, '*');
    } catch(err) {
      e.source.postMessage({ type: 'storage', key: d.key, value: '' }, '*');
    }
  } else if (d.type === 'setStorage' && typeof d.key === 'string') {
    try {
      if (d.value) localStorage.setItem(d.key, d.value);
      else localStorage.removeItem(d.key);
    } catch(err) {}
  }
});

// 外层 URL hash 变化（user paste 新 #token=xxx 后回车）→ 主动通知 iframe 重新读
window.addEventListener('hashchange', function() {
  var frame = document.getElementById('render-frame');
  if (frame && frame.contentWindow) {
    try { frame.contentWindow.postMessage({ type: 'hash', hash: location.hash || '' }, '*'); } catch(e) {}
  }
});

function showLoading(msg) {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error').style.display = 'none';
  document.getElementById('render-frame').style.display = 'none';
  document.getElementById('load-status').textContent = msg || '加载中...';
}

function showError(msg, icon) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-icon').textContent = icon || '⚠️';
}

function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

async function loadPage(attempt) {
  attempt = attempt || 0;

  if (!id) {
    showError('缺少页面 ID', '❌');
    return;
  }

  if (attempt === 0) {
    showLoading('加载中...');
  } else {
    showLoading('第 ' + attempt + ' 次重试...');
  }

  try {
    const res = await fetchWithTimeout(
      API + '/get_render?id=' + encodeURIComponent(id),
      FETCH_TIMEOUT
    );
    const data = await res.json();

    if (data.error) {
      var msgs = {
        'not found': '页面不存在或已被删除',
        'expired': '页面已过期',
      };
      showError(msgs[data.error] || data.error, data.error === 'expired' ? '⏰' : '🔍');
      return;
    }

    if (data.title) {
      document.title = '天机阁 · ' + data.title;
    }

    // 确保 HTML 有中文语言标记
    var html = data.html || '';
    if (html.indexOf('<html') !== -1 && html.indexOf('lang=') === -1) {
      html = html.replace('<html', '<html lang="zh-CN"');
    }
    if (html.indexOf('charset') === -1 && html.indexOf('<head>') !== -1) {
      html = html.replace('<head>', '<head><meta charset="UTF-8">');
    }

    // 注入桥接脚本：sandboxed iframe 不能访问 top.location，也不能被 outer 读 contentDocument。
    // 全部走 postMessage:
    //   - {type:'navigate', url}: outer 校验同站后用 top.location 跳转
    //   - {type:'resize', height}: outer 调 iframe.style.height 自适应
    var bridgeScript = "<script>(function(){var PID=" + JSON.stringify(id || 'unknown') + ";var SK='scroll_'+PID;function send(m){try{parent.postMessage(m,'*')}catch(e){}}document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(a){var u=a.href;if(u){e.preventDefault();send({type:'navigate',url:u})}}},true);function reportH(){var b=document.body,h=0;if(b){h=Math.max(b.scrollHeight||0,b.offsetHeight||0)}if(h<=100){var e=document.documentElement;h=e?(e.scrollHeight||0):0}if(h>100)send({type:'resize',height:h})}window.addEventListener('load',reportH);if(window.MutationObserver){var ob=new MutationObserver(reportH);document.addEventListener('DOMContentLoaded',function(){ob.observe(document.documentElement,{childList:true,subtree:true,attributes:true})})}setInterval(reportH,1500);['touchstart','wheel','keydown','pointerdown'].forEach(function(ev){window.addEventListener(ev,function(){send({type:'gesture'})},{passive:true,capture:true})});var stt=null;function saveScroll(){if(stt)clearTimeout(stt);stt=setTimeout(function(){var y=window.scrollY||window.pageYOffset||0;send({type:'setStorage',key:SK,value:String(y)})},400)}window.addEventListener('scroll',saveScroll,{passive:true});window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='storage'&&d.key===SK&&d.value){var y=parseInt(d.value,10);if(!isNaN(y)&&y>0){var tries=0;function tryScroll(){tries++;window.scrollTo(0,y);var actual=window.scrollY||window.pageYOffset||0;if(Math.abs(actual-y)>10&&tries<20){setTimeout(tryScroll,150)}}setTimeout(tryScroll,200)}}});window.addEventListener('load',function(){setTimeout(function(){send({type:'getStorage',key:SK})},100)})})();<\/script>";
    if (html.indexOf('</body>') !== -1) {
      html = html.replace('</body>', bridgeScript + '</body>');
    } else {
      html = html + bridgeScript;
    }

    var frame = document.getElementById('render-frame');
    frame.srcdoc = html;
    frame.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'none';

  } catch (e) {
    if (attempt < MAX_RETRIES) {
      var delay = RETRY_DELAYS[attempt] || 4000;
      showLoading('加载超时，' + (delay/1000) + '秒后重试 (' + (attempt+1) + '/' + MAX_RETRIES + ')...');
      await new Promise(function(r) { setTimeout(r, delay); });
      return loadPage(attempt + 1);
    }
    showError('加载失败，请检查网络后重试', '😵');
  }
}

loadPage();
</script>
</body>
</html>
