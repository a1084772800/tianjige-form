<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Language" content="zh-CN">
<title>天机阁 · 动态页面</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #0a0a0a;
  color: #e8e0d0;
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
}
.loading h1 {
  font-size: 1.4rem;
  background: linear-gradient(to right, #f6d365, #fda085);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}
.loading .spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(246,211,101,0.2);
  border-top-color: #f6d365;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading .status {
  color: #a09080;
  font-size: 0.85rem;
  margin-top: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error {
  text-align: center;
  padding: 60px 20px;
  color: #a09080;
}
.error h2 { color: #f6d365; margin-bottom: 12px; }
.error .retry-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 8px;
  border: 1px solid #f6d365;
  color: #f6d365;
  background: transparent;
  cursor: pointer;
  font-size: 0.95rem;
}
.error .retry-btn:active { opacity: 0.7; }
#render-frame {
  width: 100%;
  height: 100vh;
  border: none;
  display: none;
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <h1>天机阁</h1>
  <div class="spinner"></div>
  <div class="status" id="load-status">加载中...</div>
</div>

<div class="error" id="error" style="display:none">
  <h2 id="error-icon">⚠️</h2>
  <p id="error-msg"></p>
  <button class="retry-btn" onclick="loadPage()">重新加载</button>
</div>

<iframe id="render-frame" sandbox="allow-scripts allow-popups allow-forms"></iframe>

<script>
const API = 'https://v609a76lof.sealoshzh.site';
const MAX_RETRIES = 3;
const RETRY_DELAYS = [1000, 2000, 4000];
const FETCH_TIMEOUT = 15000;

const params = new URLSearchParams(location.search);
const id = params.get('id');

// ── Scroll position 持久化（PARENT 端，因 iframe height=auto 实际滚的是外层）───
// iframe 用 sandbox（无 allow-same-origin），parent.body 把 iframe.style.height 设成
// 全内容高度，所以 OUTER document 才是真正可滚动的；iframe 内部的 window.scroll
// 事件根本不会触发——bridge 里的 saveScroll 是僵尸代码（保留兼容旧 srcdoc）。
// 这里在 PARENT 加 listener，按 id 分 key，保证 PWA/X5/iOS Safari 切回不丢位置。
var SCROLL_KEY = 'scroll_render_' + (id || 'unknown');
var pScrollRestoring = true;
var pScrollSaveTimer = null;
function pFlushScroll() {
  if (pScrollRestoring) return;
  if (pScrollSaveTimer) { clearTimeout(pScrollSaveTimer); pScrollSaveTimer = null; }
  try {
    var y = window.scrollY || window.pageYOffset || 0;
    if (y > 0) localStorage.setItem(SCROLL_KEY, String(y));
    else localStorage.removeItem(SCROLL_KEY);
  } catch(_) {}
}
function pSaveScroll() {
  if (pScrollRestoring) return;
  if (pScrollSaveTimer) clearTimeout(pScrollSaveTimer);
  pScrollSaveTimer = setTimeout(pFlushScroll, 400);
}
window.addEventListener('scroll', pSaveScroll, { passive: true });
// freeze 前最后一次机会
window.addEventListener('pagehide', pFlushScroll);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') pFlushScroll();
});

function pRestoreScroll() {
  var y = 0;
  try { y = parseInt(localStorage.getItem(SCROLL_KEY) || '0', 10) || 0; } catch(_) {}
  if (y <= 0) { pScrollRestoring = false; return; }
  var tries = 0;
  function tryIt() {
    tries++;
    // 必须等 iframe.style.height 已被 resize bridge 设大；否则 document 高度不够 scrollTo 截到顶
    var sh = document.documentElement.scrollHeight;
    if (sh < y + 100 && tries < 40) { setTimeout(tryIt, 200); return; }
    window.scrollTo(0, y);
    var actual = window.scrollY || window.pageYOffset || 0;
    if (Math.abs(actual - y) > 10 && tries < 40) setTimeout(tryIt, 200);
    else pScrollRestoring = false;
  }
  // 等 srcdoc 渲染 + bridge resize 一波；800ms 起步更稳（render.html 测试 iframe 800ms 才高度到位）
  setTimeout(tryIt, 800);
}
// load 时 iframe 可能还没回 resize，pRestoreScroll 自己重试到高度够
window.addEventListener('load', function() { setTimeout(pRestoreScroll, 100); });
// bfcache 回来（iOS Safari / 安卓 Chrome 后台不 reload 走这里）
window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    pScrollRestoring = true;
    setTimeout(pRestoreScroll, 50);
  }
});

// 桥接：iframe 因 sandbox 无 same-origin / top-navigation，走 postMessage
window.addEventListener('message', function(e) {
  var frame = document.getElementById('render-frame');
  if (!frame || e.source !== frame.contentWindow) return;
  var d = e.data || {};
  if (d.type === 'resize' && typeof d.height === 'number' && d.height > 100 && d.height < 100000) {
    frame.style.height = d.height + 'px';
  } else if (d.type === 'navigate' && typeof d.url === 'string') {
    // 简单 URL 校验：必须是绝对 http(s) 链接，禁 javascript: / data: 等
    if (/^https?:\/\//i.test(d.url)) {
      window.top.location.href = d.url;
    }
  } else if (d.type === 'title' && typeof d.text === 'string' && d.text.trim()) {
    // 页面自定义标签页标题（可选桥）：内容页发 {type:'title', text} 覆盖默认
    // 的「天机阁 · <title>」前缀（2026-07-13 乔氏驾驶舱去品牌残留；向后兼容，
    // 不发消息的页面行为不变）
    document.title = d.text.slice(0, 80);
  } else if (d.type === 'getHash') {
    // 沙箱 iframe 拿不到 parent.location.hash（cross-origin），走 postMessage 桥接
    try { e.source.postMessage({ type: 'hash', hash: location.hash || '' }, '*'); } catch(err) {}
  } else if (d.type === 'setHash' && typeof d.hash === 'string') {
    // iframe 内 token-status 编辑后回写 parent URL → owner 刷新仍持久
    try {
      var newHash = d.hash;
      if (newHash && newHash.charAt(0) !== '#') newHash = '#' + newHash;
      // 用 replaceState 不进 history（owner 反复点不堆栈）
      history.replaceState(null, '', location.pathname + location.search + newHash);
    } catch(err) {}
  } else if (d.type === 'getStorage' && typeof d.key === 'string') {
    // sandboxed iframe 没 same-origin，自身 localStorage 抛 SecurityError；走 parent 代存
    try {
      var v = localStorage.getItem(d.key);
      e.source.postMessage({ type: 'storage', key: d.key, value: v || '' }, '*');
    } catch(err) {
      e.source.postMessage({ type: 'storage', key: d.key, value: '' }, '*');
    }
  } else if (d.type === 'setStorage' && typeof d.key === 'string') {
    try {
      if (d.value) localStorage.setItem(d.key, d.value);
      else localStorage.removeItem(d.key);
    } catch(err) {}
  }
});

// 外层 URL hash 变化（user paste 新 #token=xxx 后回车）→ 主动通知 iframe 重新读
window.addEventListener('hashchange', function() {
  var frame = document.getElementById('render-frame');
  if (frame && frame.contentWindow) {
    try { frame.contentWindow.postMessage({ type: 'hash', hash: location.hash || '' }, '*'); } catch(e) {}
  }
});

function showLoading(msg) {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('error').style.display = 'none';
  document.getElementById('render-frame').style.display = 'none';
  document.getElementById('load-status').textContent = msg || '加载中...';
}

function showError(msg, icon) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-icon').textContent = icon || '⚠️';
}

function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

async function loadPage(attempt) {
  attempt = attempt || 0;

  if (!id) {
    showError('缺少页面 ID', '❌');
    return;
  }

  if (attempt === 0) {
    showLoading('加载中...');
  } else {
    showLoading('第 ' + attempt + ' 次重试...');
  }

  try {
    const res = await fetchWithTimeout(
      API + '/get_render?id=' + encodeURIComponent(id),
      FETCH_TIMEOUT
    );
    const data = await res.json();

    if (data.error) {
      var msgs = {
        'not found': '页面不存在或已被删除',
        'expired': '页面已过期',
      };
      showError(msgs[data.error] || data.error, data.error === 'expired' ? '⏰' : '🔍');
      return;
    }

    if (data.title) {
      document.title = '天机阁 · ' + data.title;
    }

    // 确保 HTML 有中文语言标记
    var html = data.html || '';
    if (html.indexOf('<html') !== -1 && html.indexOf('lang=') === -1) {
      html = html.replace('<html', '<html lang="zh-CN"');
    }
    if (html.indexOf('charset') === -1 && html.indexOf('<head>') !== -1) {
      html = html.replace('<head>', '<head><meta charset="UTF-8">');
    }

    // 注入桥接脚本：sandboxed iframe 不能访问 top.location，也不能被 outer 读 contentDocument。
    // 全部走 postMessage:
    //   - {type:'navigate', url}: outer 校验同站后用 top.location 跳转
    //   - {type:'resize', height}: outer 调 iframe.style.height 自适应
    var bridgeScript = "<script>(function(){var PID=" + JSON.stringify(id || 'unknown') + ";var SK='scroll_'+PID;function send(m){try{parent.postMessage(m,'*')}catch(e){}}document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(a){var u=a.href;if(u){e.preventDefault();send({type:'navigate',url:u})}}},true);function reportH(){var h=Math.max(document.documentElement.scrollHeight||0,document.body?document.body.scrollHeight:0);if(h>100)send({type:'resize',height:h})}window.addEventListener('load',reportH);if(window.MutationObserver){var ob=new MutationObserver(reportH);document.addEventListener('DOMContentLoaded',function(){ob.observe(document.documentElement,{childList:true,subtree:true,attributes:true})})}setInterval(reportH,1500);var stt=null;function saveScroll(){if(stt)clearTimeout(stt);stt=setTimeout(function(){var y=window.scrollY||window.pageYOffset||0;send({type:'setStorage',key:SK,value:String(y)})},400)}window.addEventListener('scroll',saveScroll,{passive:true});window.addEventListener('message',function(e){var d=e.data||{};if(d.type==='storage'&&d.key===SK&&d.value){var y=parseInt(d.value,10);if(!isNaN(y)&&y>0){var tries=0;function tryScroll(){tries++;window.scrollTo(0,y);var actual=window.scrollY||window.pageYOffset||0;if(Math.abs(actual-y)>10&&tries<20){setTimeout(tryScroll,150)}}setTimeout(tryScroll,200)}}});window.addEventListener('load',function(){setTimeout(function(){send({type:'getStorage',key:SK})},100)})})();<\/script>";
    if (html.indexOf('</body>') !== -1) {
      html = html.replace('</body>', bridgeScript + '</body>');
    } else {
      html = html + bridgeScript;
    }

    var frame = document.getElementById('render-frame');
    frame.srcdoc = html;
    frame.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'none';

  } catch (e) {
    if (attempt < MAX_RETRIES) {
      var delay = RETRY_DELAYS[attempt] || 4000;
      showLoading('加载超时，' + (delay/1000) + '秒后重试 (' + (attempt+1) + '/' + MAX_RETRIES + ')...');
      await new Promise(function(r) { setTimeout(r, delay); });
      return loadPage(attempt + 1);
    }
    showError('加载失败，请检查网络后重试', '😵');
  }
}

loadPage();
</script>
</body>
</html>
