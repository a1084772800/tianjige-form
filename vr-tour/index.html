<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>灵犀 AI · VR 看房</title>
<meta name="description" content="3D 高斯泼溅真实空间漫游：网页打开走进去看，戴上头显沉浸体验。">
<meta property="og:title" content="灵犀 AI · VR 看房">
<meta property="og:description" content="3D 高斯泼溅真实空间漫游，扫一次房上传，AI 自动生成 VR 看房链接。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0e14;color:#f0f1f2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#chrome{position:fixed;inset:0;pointer-events:none;z-index:10}
#header{position:absolute;top:0;left:0;right:0;padding:18px 20px;background:linear-gradient(180deg,rgba(10,14,20,.92),rgba(10,14,20,0));pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;color:#fff}
#logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#ff8a3d,#ffb84d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#0a0e14}
#brand-text{font-size:16px;font-weight:600;letter-spacing:.5px}
#brand-sub{font-size:11px;opacity:.6;margin-top:2px;font-weight:400}
#hint{position:absolute;bottom:148px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:24px;font-size:12.5px;color:#cfd2d6;white-space:nowrap;pointer-events:none;animation:fadeIn .8s .4s both;max-width:90vw;text-align:center}
#cta{position:absolute;bottom:24px;left:16px;right:16px;padding:18px 20px;background:rgba(20,25,32,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,138,61,.35);border-radius:18px;pointer-events:auto;animation:fadeIn .8s .8s both}
#cta-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
#cta-text{flex:1;min-width:0}
#cta-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:3px}
#cta-desc{font-size:12px;color:#a8acb3;line-height:1.5}
#cta-price{color:#ff8a3d;font-weight:600}
#cta-btn{flex-shrink:0;padding:10px 18px;background:linear-gradient(135deg,#ff8a3d,#ffb84d);border:none;border-radius:10px;color:#0a0e14;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#cta-btn:active{transform:scale(.96)}
#tools{position:absolute;top:14px;right:14px;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
#tools button{padding:7px 12px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:18px;color:#fff;font-size:11.5px;cursor:pointer;letter-spacing:.3px}
#tools button.active{background:linear-gradient(135deg,#ff8a3d,#ffb84d);color:#0a0e14;border-color:transparent;font-weight:600}
#tools button:hover:not(.active){background:rgba(255,255,255,.13)}
#vr-btn{padding:7px 12px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,138,61,.45);border-radius:18px;color:#ff8a3d;font-size:11.5px;cursor:pointer;display:none;font-weight:600}
#vr-btn.show{display:block}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0e14;z-index:20;transition:opacity .6s}
#loader.gone{opacity:0;pointer-events:none}
#spinner{width:48px;height:48px;border:3px solid rgba(255,138,61,.2);border-top-color:#ff8a3d;border-radius:50%;animation:spin 1s linear infinite}
#loader-text{margin-top:18px;font-size:13px;color:#8a8e94;letter-spacing:1px}
#loader-progress{margin-top:8px;font-size:11px;color:#646870;font-variant-numeric:tabular-nums}
#joystick{position:fixed;left:24px;bottom:140px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;touch-action:none;display:none;pointer-events:auto}
#joystick.show{display:block}
#joystick-knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,138,61,.55);left:50%;top:50%;transform:translate(-50%,-50%);transition:background .12s;box-shadow:0 4px 14px rgba(255,138,61,.4)}
#joystick.active #joystick-knob{background:rgba(255,184,77,.85)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (min-width:768px){#cta{left:50%;transform:translateX(-50%);max-width:520px}#hint{bottom:128px}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="joystick"><div id="joystick-knob"></div></div>

<div id="chrome">
  <div id="header">
    <div id="brand">
      <div id="logo">灵</div>
      <div>
        <div id="brand-text">灵犀 AI · VR 看房</div>
        <div id="brand-sub">3D Gaussian Splatting · WebXR Demo</div>
      </div>
    </div>
  </div>
  <div id="tools">
    <button id="vr-btn">进入 VR</button>
  </div>
  <div id="hint">手机端 · 左下摇杆移动 · 拖屏幕看四周 · 桌面 W/A/S/D + 鼠标</div>
  <div id="cta">
    <div id="cta-row">
      <div id="cta-text">
        <div id="cta-title">扫你的房 → 私信加 V</div>
        <div id="cta-desc"><span id="cta-price">¥199 / 月</span> · 上传你的空间，AI 自动生成 VR 看房链接</div>
      </div>
      <button id="cta-btn">了解详情</button>
    </div>
  </div>
</div>

<div id="loader">
  <div id="spinner"></div>
  <div id="loader-text">正在加载真实空间</div>
  <div id="loader-progress">0%</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
  "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark/dist/spark.module.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SparkControls, SparkXr } from "@sparkjsdev/spark";

// Scene catalog -------------------------------------------------------------
// All splats are real photogrammetric 3D Gaussian Splatting captures hosted by
// Niantic Spark (sparkjs.dev / forge-dev-public storage).
const SCENES = {
  marble:    { url: "https://storage.googleapis.com/forge-dev-public/marble-scenes/greyscale-room.spz",      label: "大理石起居室", offset: [0,0,0], start: [0,0,3], sizeMB: 30 },
  fireplace: { url: "https://sparkjs.dev/assets/splats/fireplace.spz",                                       label: "暖炉客厅",     offset: [0,0,0], start: [0,0,3], sizeMB:  4 },
  painted:   { url: "https://storage.googleapis.com/forge-dev-public/painted_bedroom.spz",                   label: "彩绘卧室",     offset: [0,0,0], start: [0,0,3], sizeMB:  8 },
  cozy:      { url: "https://storage.googleapis.com/forge-dev-public/asundqui/cozy-xr/cozy_cottage-lod.spz", label: "舒适小屋",     offset: [0,-1,0], start: [0,1.6,0], sizeMB: 93, isLOD: true }
};
const params = new URLSearchParams(location.search);
const sceneKey = SCENES[params.get("scene")] ? params.get("scene") : "cozy";
const SCENE = SCENES[sceneKey];

// DOM refs ------------------------------------------------------------------
const canvas      = document.getElementById("canvas");
const loader      = document.getElementById("loader");
const loaderText  = document.getElementById("loader-text");
const loaderProg  = document.getElementById("loader-progress");
const vrBtn       = document.getElementById("vr-btn");
const ctaBtn      = document.getElementById("cta-btn");
const joystick    = document.getElementById("joystick");
const knob        = document.getElementById("joystick-knob");

// Three.js core -------------------------------------------------------------
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.xr.enabled = true;

addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const spark = new SparkRenderer({ renderer });
scene.add(spark);

// Camera rig that we move around (XR-friendly: camera stays inside rig) -----
const rig = new THREE.Group();
rig.position.set(...SCENE.start);  // scene-specific spawn point (eye height)
scene.add(rig);
rig.add(camera);

// Auto-frame: place camera at splat center, eye height, looking into the room
// LOD splats expose Infinity bbox until centers stream in — we fall back to
// the scene's preset `start` position in that case.
let softBounds = { minX:-12, maxX:12, minZ:-12, maxZ:12, minY:0.4, maxY:3 };
function fitCameraToSplat() {
  if (!splatMesh || !splatMesh.isInitialized) return;
  try {
    const bbox = splatMesh.getBoundingBox(true);
    const validBox = isFinite(bbox.min.x) && isFinite(bbox.max.x);
    if (!validBox) {
      console.log("[vr-tour] bbox not yet populated (LOD streaming) — using preset start", SCENE.start);
      rig.position.set(...SCENE.start);
      // Retry after 3s for LOD splats
      setTimeout(fitCameraToSplat, 3000);
      return;
    }
    const center = bbox.getCenter(new THREE.Vector3());
    const size   = bbox.getSize(new THREE.Vector3());
    // Place camera at the splat's geometric center (works for any orientation)
    // This guarantees camera is INSIDE the splat looking at densest content
    const worldCenter = center.clone()
      .applyQuaternion(splatMesh.quaternion)
      .add(splatMesh.position);
    rig.position.copy(worldCenter);
    // Aim the rig at a point inside the bbox (closer to one wall) so the
    // initial view shows interior content, not empty space behind us
    const aim = worldCenter.clone();
    // pick the axis with the largest extent and aim along it
    if (size.x >= size.z) {
      aim.x = bbox.min.x + splatMesh.position.x + size.x * 0.2;  // look toward -X wall
    } else {
      aim.z = bbox.min.z + splatMesh.position.z + size.z * 0.2;  // look toward -Z wall
    }
    rig.lookAt(aim);
    camera.rotation.set(0, 0, 0);
    lookInput.yaw = rig.rotation.y; lookInput.pitch = 0;

    // Soft bounds: shrink bbox by 25% from each side to keep camera in densely
    // sampled region (splat edges are usually noisy)
    const shrink = 0.25;
    softBounds = {
      minX: bbox.min.x + splatMesh.position.x + size.x * shrink,
      maxX: bbox.max.x + splatMesh.position.x - size.x * shrink,
      minY: bbox.min.y + splatMesh.position.y + size.y * shrink,
      maxY: bbox.max.y + splatMesh.position.y - size.y * shrink,
      minZ: bbox.min.z + splatMesh.position.z + size.z * shrink,
      maxZ: bbox.max.z + splatMesh.position.z - size.z * shrink
    };
    // Auto-scale movement speed: bigger room = faster walk (max 3 m/s)
    moveSpeedScale = Math.min(2.5, Math.max(0.6, size.length() / 8));
    console.log("[vr-tour] fit camera", JSON.stringify({ rig: rig.position.toArray(), bbox_min: bbox.min.toArray(), bbox_max: bbox.max.toArray() }));
  } catch (e) { console.warn("fitCameraToSplat", e); }
}

// Load splat with progress fetch -------------------------------------------
async function loadSplatProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`fetch ${url}: ${res.status}`);
  const total = +res.headers.get("content-length") || SCENE.sizeMB * 1024 * 1024;
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    const pct = Math.min(99, Math.round(received / total * 100));
    loaderProg.textContent = pct + "%";
  }
  const blob = new Blob(chunks);
  return URL.createObjectURL(blob);
}

let splatMesh;
try {
  loaderText.textContent = "正在加载 " + SCENE.label;
  const objUrl = await loadSplatProgress(SCENE.url);
  splatMesh = new SplatMesh({
    url: objUrl,
    onLoad: () => fitCameraToSplat()
  });
  splatMesh.position.set(...SCENE.offset);
  scene.add(splatMesh);
  // Expose handles for runtime debugging (?debug=1) and headless QA
  if (params.has("debug")) {
    Object.assign(window, { __scene: scene, __rig: rig, __camera: camera, __splat: splatMesh, __renderer: renderer });
  }
  loaderProg.textContent = "100%";
  setTimeout(() => loader.classList.add("gone"), 350);
} catch (e) {
  loaderText.textContent = "加载失败 · 请刷新或检查网络";
  loaderProg.textContent = String(e).slice(0, 80);
  console.error(e);
}

// Desktop controls (mouse drag look + WASD via Spark built-in) -------------
const sparkControls = new SparkControls({ canvas: renderer.domElement });

// Mobile: virtual joystick + drag-to-look (single touch outside joystick) --
const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const isVRHeadset = /OculusBrowser|Quest|Oculus/i.test(navigator.userAgent);
const mobileInput = { x: 0, y: 0, active: false };
const lookInput   = { yaw: 0, pitch: 0 };  // accumulated touch-look deltas

if (isTouch && !isVRHeadset) {
  joystick.classList.add("show");

  let stickTouchId = null;
  let stickRect = null;
  const STICK_RADIUS = 35;   // travel cap

  function setKnob(dx, dy) {
    const mag = Math.hypot(dx, dy);
    let nx = dx, ny = dy;
    if (mag > STICK_RADIUS) { nx = dx * STICK_RADIUS / mag; ny = dy * STICK_RADIUS / mag; }
    knob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    mobileInput.x = nx / STICK_RADIUS;
    mobileInput.y = ny / STICK_RADIUS;
  }
  function resetKnob() {
    knob.style.transform = "translate(-50%, -50%)";
    mobileInput.x = mobileInput.y = 0;
    mobileInput.active = false;
    joystick.classList.remove("active");
  }

  joystick.addEventListener("touchstart", e => {
    if (stickTouchId !== null) return;
    const t = e.changedTouches[0];
    stickTouchId = t.identifier;
    stickRect = joystick.getBoundingClientRect();
    mobileInput.active = true;
    joystick.classList.add("active");
    setKnob(t.clientX - (stickRect.left + stickRect.width/2),
            t.clientY - (stickRect.top + stickRect.height/2));
    e.preventDefault();
  }, { passive: false });

  // Look-around: any touch starting OUTSIDE the joystick ---------------------
  let lookTouchId = null;
  let lookLast = { x: 0, y: 0 };

  document.addEventListener("touchstart", e => {
    for (const t of e.changedTouches) {
      // Skip if this touch is already the joystick stick
      if (t.identifier === stickTouchId) continue;
      // Skip if the touch hits a button / cta
      const tgt = document.elementFromPoint(t.clientX, t.clientY);
      if (tgt && tgt.closest("#joystick, #cta, #vr-btn, #cta-btn")) continue;
      if (lookTouchId === null) {
        lookTouchId = t.identifier;
        lookLast.x = t.clientX;
        lookLast.y = t.clientY;
      }
    }
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId && stickRect) {
        setKnob(t.clientX - (stickRect.left + stickRect.width/2),
                t.clientY - (stickRect.top + stickRect.height/2));
        e.preventDefault();
      } else if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLast.x;
        const dy = t.clientY - lookLast.y;
        lookLast.x = t.clientX;
        lookLast.y = t.clientY;
        lookInput.yaw   -= dx * 0.0035;
        lookInput.pitch -= dy * 0.0035;
        lookInput.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, lookInput.pitch));
        e.preventDefault();
      }
    }
  }, { passive: false });

  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === stickTouchId) { stickTouchId = null; resetKnob(); }
      if (t.identifier === lookTouchId)  { lookTouchId  = null; }
    }
  }
  document.addEventListener("touchend",    endTouch, { passive: false });
  document.addEventListener("touchcancel", endTouch, { passive: false });
}

// WebXR -------------------------------------------------------------------
const xr = new SparkXr({ renderer });
if (navigator.xr) {
  navigator.xr.isSessionSupported("immersive-vr").then(ok => {
    if (ok) vrBtn.classList.add("show");
  }).catch(() => {});
}
vrBtn.addEventListener("click", () => xr.enterXr?.());

// Animation / movement loop -----------------------------------------------
const MOVE_SPEED = 1.6;   // m/s base; multiplied by moveSpeedScale per scene
let moveSpeedScale = 1.0;
const fwd  = new THREE.Vector3();
const rgt  = new THREE.Vector3();
const up   = new THREE.Vector3(0, 1, 0);
const tmpQ = new THREE.Quaternion();

let lastT = 0;
renderer.setAnimationLoop((time) => {
  const dt = Math.min(0.05, (time - (lastT || time)) / 1000);
  lastT = time;

  // SparkControls drives the camera-rig (which contains the camera)
  // - keyboard WASD moves the rig
  // - mouse drag rotates the rig
  // For touch devices we use our own controls (joystick + drag-look)
  if (!isTouch) sparkControls.update(rig, camera);
  // Touch look applied to camera independent of rig


  // Mobile drag-look: apply yaw to the rig (so XR + non-XR both work)
  // We layer rig.rotation.y for yaw, camera.rotation.x for pitch
  if (isTouch && !isVRHeadset) {
    rig.rotation.y = lookInput.yaw;
    camera.rotation.x = lookInput.pitch;
    camera.rotation.y = 0;
    camera.rotation.z = 0;
  }

  // Mobile joystick → translate the rig forward / strafe
  if (mobileInput.active && (Math.abs(mobileInput.x) > 0.12 || Math.abs(mobileInput.y) > 0.12)) {
    camera.getWorldDirection(fwd);
    fwd.y = 0; fwd.normalize();
    rgt.crossVectors(fwd, up).normalize();

    const dx = mobileInput.x * MOVE_SPEED * moveSpeedScale * dt;
    const dy = mobileInput.y * MOVE_SPEED * moveSpeedScale * dt;
    rig.position.addScaledVector(fwd, -dy);       // negative y = forward
    rig.position.addScaledVector(rgt,  dx);

    // Soft bounding box so a wandering finger doesn't fly out of the room
    rig.position.x = Math.max(softBounds.minX, Math.min(softBounds.maxX, rig.position.x));
    rig.position.z = Math.max(softBounds.minZ, Math.min(softBounds.maxZ, rig.position.z));
    rig.position.y = Math.max(softBounds.minY, Math.min(softBounds.maxY, rig.position.y));
  }

  renderer.render(scene, camera);
});

// Scene switcher pills (insert before VR button) -----------------------
const tools = document.getElementById("tools");
for (const [key, s] of Object.entries(SCENES)) {
  const b = document.createElement("button");
  b.textContent = s.label;
  b.className = (key === sceneKey) ? "active" : "";
  b.addEventListener("click", () => {
    if (key === sceneKey) return;
    const u = new URL(location.href);
    u.searchParams.set("scene", key);
    location.href = u.toString();
  });
  tools.insertBefore(b, vrBtn);
}

// CTA --------------------------------------------------------------------
ctaBtn.addEventListener("click", () => {
  alert("请添加微信：lingxi-ai · 上传你的空间扫描，24h 内拿到 VR 链接");
});

// Block iOS rubber-band scroll ------------------------------------------
document.addEventListener("touchmove", e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

// Hard fallback: hide loader after 25s no matter what -------------------
setTimeout(() => loader.classList.add("gone"), 25000);
</script>
</body>
</html>
